<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bisBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002F6C"/>
      <stop offset="100%" stop-color="#004AAD"/>
    </linearGradient>
    <linearGradient id="bisGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Left: Emblem / Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle Container -->
    <rect width="100" height="100" rx="16" fill="url(#bisBlue)"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="url(#bisGold)" stroke-width="2"/>
    
    <!-- Stylized Standard Mark Motif -->
    <path d="M50 20 L74 38 L65 72 L35 72 L26 38 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M50 26 L68 40 L61 66 L39 66 L32 40 Z" fill="url(#bisGold)" fill-opacity="0.25"/>
    
    <!-- BIS Text Inside Emblem -->
    <text x="50" y="56" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" 
          font-weight="900" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="2">
      BIS
    </text>
    <circle cx="50" cy="65" r="2.5" fill="url(#bisGold)"/>
  </g>

  <!-- Right: Typography Branding -->
  <g transform="translate(125, 22)">
    <!-- Hindi Subtitle -->
    <text x="0" y="20" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="700" 
          fill="#002F6C"
          letter-spacing="0.5">
      भारतीय मानक ब्यूरो
    </text>
    
    <!-- English Main Title -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="19" 
          font-weight="800" 
          fill="#001B3D" 
          letter-spacing="0.3">
      BUREAU OF INDIAN STANDARDS
    </text>

    <!-- Ministry / Department -->
    <text x="0" y="66" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" 
          font-weight="600" 
          fill="#6B7280"
          letter-spacing="0.5">
      National Standards Body of India &bull; Govt. of India
    </text>
  </g>
</svg>
